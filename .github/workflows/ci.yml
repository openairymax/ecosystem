name: CI

# ecosystem 是策略载荷仓（agents/markets/prompts/skills/manager 五模块）。
# 流水线体系 L1 仓内快速门禁（agentrt release.yml 同体系分层）：
#   validate —— 零依赖语法与结构门禁：全模块 compileall + YAML/JSON
#               全量解析 + 四模块 tests/ 存在性（防测试面被静默删除；
#               prompts 模板载荷无测试面，历史提交 417afab 有意移除，
#               其质量由模板 quality-gate 保证，不设假断言）。
#   pytest   —— 策略载荷真实测试面：agents/manager/markets/skills
#              各自 rootdir 下全量 pytest（模块内相对导入依赖模块级
#              sys.path，故逐模块 cd 运行）。
# 作业数 ≤3 是本仓流水线判据（1 失败域 = 1 作业）；纯文档变更跳过。
# 触发面注记：伞仓镜像作业以 Actions 令牌推送，GitHub 不据此触发本流水线；
# paths-ignore 又会跳过零文件变更的推送。镜像同步或重置提交之后，需用
# workflow_dispatch 或携带真实变更的提交重新进入流水线。

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules (mirror-lag tolerant)
        # 子模块指针指向 atomgit 同步到 GitHub 的提交，同步有秒级延迟；
        # 单次固定 checkout 会被镜像滞后误伤（2026-11-22 59b261b 即此）。
        # 2026-11-23 f3ea65c 再次复现：等 2 分钟后镜像仍未到，故把窗口
        # 放宽到 8 次退避（约 7 分钟），耗尽仍硬失败，不掩盖真的缺提交。
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            git submodule sync --recursive
            if git submodule update --init --recursive --jobs 4; then
              echo "[OK] submodules at pinned commits (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::submodule checkout failed (attempt ${attempt}/8)"
            if [ "${attempt}" -lt 8 ]; then sleep $((attempt * 15)); fi
          done
          echo "::error::submodules unavailable after 8 attempts (~7min mirror lag)"
          exit 1
      - name: Compile all modules (syntax gate)
        run: |
          python3 -m compileall -q agents markets prompts skills manager
      - name: Parse all YAML/JSON payloads
        run: |
          pip install pyyaml --quiet
          python3 - <<'EOF'
          import glob, json, sys
          import yaml
          bad = []
          for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              if '.github/' in f:
                  continue
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          for f in glob.glob('**/*.json', recursive=True):
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad.append(f'{f}: {e}')
          if bad:
              print('\n'.join(bad), file=sys.stderr)
              sys.exit(1)
          print('[OK] all yaml/json payloads parse')
          EOF
      - name: Test suites must exist (fail-closed)
        run: |
          for m in agents manager markets skills; do
            [ -d "$m/tests" ] || { echo "::error::$m/tests missing"; exit 1; }
          done
          echo '[OK] four module test suites present'

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules (mirror-lag tolerant)
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            git submodule sync --recursive
            if git submodule update --init --recursive --jobs 4; then
              echo "[OK] submodules at pinned commits (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::submodule checkout failed (attempt ${attempt}/8)"
            if [ "${attempt}" -lt 8 ]; then sleep $((attempt * 15)); fi
          done
          echo "::error::submodules unavailable after 8 attempts (~7min mirror lag)"
          exit 1
      - name: Install test dependencies
        run: |
          pip install pytest pyyaml pytest-asyncio --quiet
      - name: Install agentrt python bindings
        # skills 模块的运行时契约引用 agentrt.plugin_types（机制核 Python
        # 绑定，SSoT 在 sdk 仓 sdk-python 模块）；独仓组装下按主线安装。
        run: pip install "agentrt @ git+https://github.com/openairymax/sdk-python@main" --quiet
      - name: Run all module suites
        run: |
          set -o pipefail
          rc=0
          for m in agents manager markets skills; do
            echo "::group::pytest $m"
            (cd "$m" && python3 -m pytest -q 2>&1 | tail -120) || rc=1
            echo "::endgroup::"
          done
          exit $rc
